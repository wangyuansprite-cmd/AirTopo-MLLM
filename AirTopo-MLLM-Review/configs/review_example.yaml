experiment:
  name: airtopo_mllm_review
  seed: 2026
  output_dir: <OUTPUT_DIRECTORY>

data:
  root: <AUTHORIZED_PROCESSED_DATA_ROOT>
  train_manifest: <TRAIN_MANIFEST_CSV>
  validation_manifest: <VALIDATION_MANIFEST_CSV>
  roi_size_dhw: [128, 192, 192]
  stride_dhw: [64, 96, 96]
  spacing_dhw_mm: [0.8, 0.8, 0.8]

model:
  pretrained_checkpoint: <AUTHORIZED_PRETRAINED_CHECKPOINT>
  trained_checkpoint: <AUTHORIZED_AIRTOPO_CHECKPOINT>
  query_modulation: residual_film
  high_resolution_ct_pathway: true

loss:
  semantic: dice_plus_weighted_bce
  positive_weight: min(sqrt(negative/positive),20)
  centerline_supervision: positive_only_recall
  centerline_weight: 0.05

inference:
  fusion: uniform_probability_average
  threshold: 0.5
  postprocessing: none

